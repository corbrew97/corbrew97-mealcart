[project]
name = "mealcart"
version = "0.1.0"
description = "AI weekly meal planner with a grocery list you can send to Instacart."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mealcart"]

[tool.setuptools.package-data]
mealcart = ["static/*", "sample_plan.json"]
